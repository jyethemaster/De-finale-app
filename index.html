  <div class="keys">${"abcdefghijklmnopqrstuvwxyz".split("").map(c=>`<button class="b ${g.includes(c)?(w.includes(c)?"ok":"no"):""}" ${g.includes(c)||end?"disabled":""} data-c="${c}">${c}</button>`).join("")}</div>

   if(v){if(v!=w[i]||(D[a][b]&(d?2:1)))return -1;x++}
   else if(g[a+dc]?.[b+dr]||g[a-dc]?.[b-dr])return -1}

  const ws=sh(cands).slice(0,26).sort((a,b)=>b.w.length-a.w.length),g=Array.from({length:XS},()=>Array(XS).fill("")),D=Array.from({length:XS},()=>Array(XS).fill(0)),pl=[];

function xw(){

 h(`<div class="sc"><span>Kruiswoord · ${WD.length} woorden</span>${chSel()}</div>${tbar()}<div id="xb" class="msg"></div>
 <div class="xg" style="grid-template-columns:repeat(${C},1fr);max-width:${C*36}px">${sol.map((row,a)=>row.map((v,b)=>v?`<div class="xc" id="x${a}_${b}" data-r="${a}" data-c="${b}">${num[a+","+b]?`<i>${num[a+","+b]}</i>`:""}<b></b></div>`:'<div class="xe"></div>').join("")).join("")}</div>

  if(WD.every(w=>w.done))finish(true)}
 function finish(win){
  if(over)return;over=true;tstop();

  else{bad();fm="⏰ Tijd is om!";for(let i=0;i<R;i++)for(let j=0;j<C;j++)if(sol[i][j]&&u[i][j]!=sol[i][j]){u[i][j]=sol[i][j];rev[i][j]=1}}

}

function wr(){

function addRow(a){a=a.map(x=>(x||"").trim());if(!a[0]||!a[1])return 0;
